name = "landing-worker"
main = "src/index.ts"
compatibility_date = "2024-12-01"
account_id = "YOUR_CLOUDFLARE_ACCOUNT_ID"

# Add one route pair per domain you serve the landing page on.
routes = [
  { pattern = "example.com/*", zone_name = "example.com" },
  { pattern = "www.example.com/*", zone_name = "example.com" },
]

[vars]
SITE_NAME = "云端接码"
MAIL_APP_URL = "https://your-app.vercel.app"
TAGLINE = "免费、自托管的临时邮箱服务"
# Optional per-host overrides as JSON: { "host": { "siteName": "...", "tagline": "..." } }
HOST_PROFILES = "{\"example.com\":{\"siteName\":\"Example\",\"tagline\":\"Your tagline here.\"}}"
